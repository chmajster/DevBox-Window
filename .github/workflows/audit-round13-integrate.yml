name: Audit integration temporary validation
on:
  push:
    branches: [fix/audit-round13-changelog]
    paths: [.github/workflows/audit-round13-integrate.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git bundle create repository.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: audit-integration-source
          path: repository.bundle
          retention-days: 1
