name: Apply full bug audit

on:
  push:
    branches:
      - fix/full-bug-audit-2026-09-11
    paths:
      - .github/full-bug-audit-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/full-bug-audit-2026-09-11
          fetch-depth: 0

      - name: Apply fixes
        shell: pwsh
        run: python .github/scripts/apply_full_bug_audit.py

      - name: Validate diff
        shell: pwsh
        run: |
          git diff --check
          dotnet restore DevBox.sln
          dotnet build DevBox.sln --configuration Release --no-restore
          dotnet test DevBox.sln --configuration Release --no-build

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'fix: harden data safety cancellation and updates'
          git push origin HEAD:fix/full-bug-audit-2026-09-11
