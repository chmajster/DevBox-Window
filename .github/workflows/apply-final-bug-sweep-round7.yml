name: Apply final bug sweep round 7

on:
  push:
    branches:
      - fix/final-bug-sweep-round7
    paths:
      - .github/final-bug-sweep-round7-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-bug-sweep-round7
          fetch-depth: 0

      - name: Apply fixes and tests
        shell: pwsh
        run: python .github/scripts/fix-final-bug-sweep-round7-build.py

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: reserve runtime ports and complete sweep"
            git push origin HEAD:fix/final-bug-sweep-round7
          }

      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          dotnet build DevBox.sln --configuration Release
          dotnet test DevBox.sln --configuration Release --no-build
