name: Apply final bug sweep round 12

on:
  push:
    branches:
      - fix/final-bug-sweep-round12-changelog
    paths:
      - .github/final-bug-sweep-round12-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-bug-sweep-round12-changelog
          fetch-depth: 0

      - name: Apply fixes, tests and changelog
        run: python .github/scripts/apply-final-bug-sweep-round12.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: close task and environment validation races"
            git push origin HEAD:fix/final-bug-sweep-round12-changelog
          fi

      - name: Validate patch formatting
        run: git diff --check
