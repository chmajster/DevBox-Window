name: PR Tests

on:
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-package-validation:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore DevBox.sln

      - name: NuGet vulnerability audit
        run: dotnet list DevBox.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build DevBox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DevBox.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      - name: Publish GUI win-x64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64

      - name: Publish CLI win-x64
        run: dotnet publish src/DevBox.Cli/DevBox.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/cli-win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Validate GUI and CLI package layout
        shell: pwsh
        run: |
          $guiPath = 'artifacts/win-x64/DevBox.exe'
          $cliSource = 'artifacts/cli-win-x64/devbox.exe'
          $cliDirectory = 'artifacts/win-x64/cli'
          $cliTarget = Join-Path $cliDirectory 'devbox.exe'

          if (-not (Test-Path $guiPath)) {
            throw 'GUI publish did not produce DevBox.exe'
          }
          if (-not (Test-Path $cliSource)) {
            throw 'CLI publish did not produce devbox.exe'
          }

          $guiHashBefore = (Get-FileHash $guiPath -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force $cliDirectory | Out-Null
          Copy-Item $cliSource $cliTarget -Force
          $guiHashAfter = (Get-FileHash $guiPath -Algorithm SHA256).Hash

          if ($guiHashBefore -ne $guiHashAfter) {
            throw 'DevBox.exe changed while adding the CLI to the application layout'
          }
          if (-not (Test-Path $cliTarget)) {
            throw 'CLI was not added to the application layout'
          }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found after installation: $iscc"
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc "/DMyAppVersion=0.0.0-ci" "/DPublishDir=$pwd\artifacts\win-x64" "/DOutputDir=$pwd\artifacts\installer" "installer\DevBox.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
