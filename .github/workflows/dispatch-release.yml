name: Dispatch Manual Release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch patch release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Manual Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f bump=patch
