name: Audit round 13 temporary validation
on:
  push:
    branches: [fix/audit-round13-changelog]
    paths: [.github/workflows/audit-round13-temp.yml, .audit-round13-trigger]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build baseline with new regression tests
        run: dotnet build DevBox.sln -c Release
      - name: Reproduce regression failures
        shell: pwsh
        run: |
          dotnet test tests/DevBox.Tests/DevBox.Tests.csproj -c Release --no-build --filter FullyQualifiedName~AuditRound13RegressionTests --logger "trx;LogFileName=round13-red.trx" --results-directory audit-results
          $result = $LASTEXITCODE
          if (-not (Test-Path audit-results/round13-red.trx)) { throw 'Missing regression results' }
          [xml]$trx = Get-Content audit-results/round13-red.trx
          $failed = [int]$trx.TestRun.ResultSummary.Counters.failed
          if ($result -eq 0 -or $failed -eq 0) { throw 'Expected tests to reproduce defects before fixes' }
          Write-Host "Confirmed $failed failing regression cases against unchanged production code."
          exit 0
      - name: Reproduce CLI help failure on unwritable runtime root
        shell: pwsh
        run: |
          $env:DEVBOX_ROOT = Join-Path $env:RUNNER_TEMP 'round13-blocked-root'
          Set-Content -Path $env:DEVBOX_ROOT -Value 'file, not a directory'
          dotnet src/DevBox.Cli/bin/Release/net8.0-windows/devbox.dll --help
          if ($LASTEXITCODE -eq 0) { throw 'Expected baseline CLI help to fail before fix' }
          Write-Host 'Confirmed baseline CLI help attempts to write to runtime root.'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-round13-red-results
          path: audit-results
          retention-days: 7
