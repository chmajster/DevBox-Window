name: Temporary Audit Round 3 Repair

on:
  push:
    branches:
      - fix/post-merge-audit-round3-2026-09-11
    paths:
      - .github/workflows/audit3-temp.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: windows-2025
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/post-merge-audit-round3-2026-09-11
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Apply audit repairs
        run: python scripts/audit3_patch.py

      - name: Preserve rendered release workflow outside workflow directory
        shell: pwsh
        run: |
          Copy-Item .github/workflows/release.yml scripts/release-audit3-rendered.yml -Force
          git checkout -- .github/workflows/release.yml

      - name: Restore
        run: dotnet restore DevBox.sln

      - name: Build
        run: dotnet build DevBox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DevBox.sln --configuration Release --no-build --logger "trx;LogFileName=audit3-results.trx"

      - name: Publish GUI win-x64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64

      - name: Publish GUI win-arm64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/win-arm64

      - name: Commit validated product changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts/release-audit3-rendered.yml
          git diff --cached --check
          if (git diff --cached --quiet) { throw 'Audit repair produced no product changes.' }
          git commit -m 'fix: harden concurrency, database rollback and secure updates'
          git push origin HEAD:fix/post-merge-audit-round3-2026-09-11
