name: Apply online module delivery patch

on:
  push:
    branches:
      - feat/online-php-phpmyadmin-downloads
    paths:
      - .github/online-module-delivery-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/online-php-phpmyadmin-downloads
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_online_module_delivery.py

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'online_php_phpmyadmin' .github/workflows/release.yml
          grep -q 'DownloadRuntimeCommand' src/DevBox.App/ViewModels/MainWindowViewModel.cs
          grep -q 'Content="Download"' src/DevBox.App/MainWindow.xaml

      - name: Commit final tree
        shell: bash
        run: |
          rm -f .github/scripts/apply_online_module_delivery.py
          rm -f .github/workflows/apply-online-module-delivery.yml
          rm -f .github/online-module-delivery-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support online PHP and phpMyAdmin delivery'
          git push origin HEAD:feat/online-php-phpmyadmin-downloads
