name: Apply bug audit follow-up

on:
  push:
    branches:
      - fix/full-bug-audit-2026-09-11
    paths:
      - .github/bug-audit-followup-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/full-bug-audit-2026-09-11
          fetch-depth: 0

      - name: Apply follow-up fixes
        shell: pwsh
        run: python .github/scripts/apply_bug_audit_followup.py

      - name: Validate follow-up
        shell: pwsh
        run: |
          git diff --check
          dotnet build DevBox.sln --configuration Release
          dotnet test DevBox.sln --configuration Release --no-build

      - name: Commit follow-up
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: correct database rollback and transfer manifest'
          git push origin HEAD:fix/full-bug-audit-2026-09-11
