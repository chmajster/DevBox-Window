name: Patch support bundle UI

on:
  push:
    branches: [ feat/support-bundle ]
    paths:
      - '.github/workflows/patch-support-bundle-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/support-bundle

      - name: Patch ViewModel, Diagnostics UI and redaction timeout
        shell: pwsh
        run: |
          function Replace-Required([string] $Path, [string] $Old, [string] $New) {
            $text = (Get-Content -LiteralPath $Path -Raw).Replace("`r`n", "`n")
            $oldLf = $Old.Replace("`r`n", "`n")
            $newLf = $New.Replace("`r`n", "`n")
            if (-not $text.Contains($oldLf)) {
              throw "Expected text was not found in $Path"
            }
            Set-Content -LiteralPath $Path -Value ($text.Replace($oldLf, $newLf)) -Encoding utf8 -NoNewline
          }

          $vm = 'src/DevBox.App/ViewModels/EnvironmentCenterViewModel.cs'
          Replace-Required $vm @'
              private string _gitProjectName = string.Empty;
              private string _configurationKey = "php";
          '@ @'
              private string _gitProjectName = string.Empty;
              private string _supportBundlePath = string.Empty;
              private string _configurationKey = "php";
          '@

          Replace-Required $vm @'
                  GitBootstrapCommand = new AsyncRelayCommand(GitBootstrapAsync);
                  DiagnosticsCommand = new RelayCommand(RefreshDiagnostics);
                  ConfigurationLoadCommand = new RelayCommand(ConfigurationLoad);
          '@ @'
                  GitBootstrapCommand = new AsyncRelayCommand(GitBootstrapAsync);
                  DiagnosticsCommand = new RelayCommand(RefreshDiagnostics);
                  SupportBundleCommand = new AsyncRelayCommand(CreateSupportBundleAsync);
                  ConfigurationLoadCommand = new RelayCommand(ConfigurationLoad);
          '@

          Replace-Required $vm @'
              public string TransferPath { get => _transferPath; set => SetProperty(ref _transferPath, value); }
              public string GitUrl { get => _gitUrl; set => SetProperty(ref _gitUrl, value); }
          '@ @'
              public string TransferPath { get => _transferPath; set => SetProperty(ref _transferPath, value); }
              public string SupportBundlePath { get => _supportBundlePath; set => SetProperty(ref _supportBundlePath, value); }
              public string GitUrl { get => _gitUrl; set => SetProperty(ref _gitUrl, value); }
          '@

          Replace-Required $vm @'
              public ICommand GitBootstrapCommand { get; }
              public ICommand DiagnosticsCommand { get; }
              public ICommand ConfigurationLoadCommand { get; }
          '@ @'
              public ICommand GitBootstrapCommand { get; }
              public ICommand DiagnosticsCommand { get; }
              public ICommand SupportBundleCommand { get; }
              public ICommand ConfigurationLoadCommand { get; }
          '@

          Replace-Required $vm @'
              private void RefreshDiagnostics()
              {
                  var report = new AdvancedDiagnosticsService(_rootPath).Run();
                  Replace(DiagnosticFindings, report.Findings);
                  Status = report.HasErrors ? "Diagnostics found errors." : report.HasWarnings ? "Diagnostics found warnings." : "Diagnostics passed.";
              }

              private void ConfigurationLoad() => RunUiAction(() =>
          '@ @'
              private void RefreshDiagnostics()
              {
                  var report = new AdvancedDiagnosticsService(_rootPath).Run();
                  Replace(DiagnosticFindings, report.Findings);
                  Status = report.HasErrors ? "Diagnostics found errors." : report.HasWarnings ? "Diagnostics found warnings." : "Diagnostics passed.";
              }

              private async Task CreateSupportBundleAsync()
              {
                  try
                  {
                      Status = "Creating redacted support bundle...";
                      var result = await Task.Run(() => new SupportBundleService(_rootPath).Create());
                      SupportBundlePath = result.ArchivePath;
                      Status = $"Support bundle created: {result.ArchivePath} ({result.IncludedFileCount} entries, {result.IncludedLogCount} log(s)).";
                  }
                  catch (Exception ex) when (ex is IOException or InvalidDataException or InvalidOperationException or UnauthorizedAccessException or ArgumentException or PlatformNotSupportedException or System.ComponentModel.Win32Exception or System.Text.RegularExpressions.RegexMatchTimeoutException)
                  {
                      Status = ex.Message;
                  }
              }

              private void ConfigurationLoad() => RunUiAction(() =>
          '@

          $xaml = 'src/DevBox.App/EnvironmentCenterWindow.xaml'
          Replace-Required $xaml @'
                      <TabItem Header="Diagnostics">
                          <Grid Margin="12"><Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="*"/></Grid.RowDefinitions><Button Content="Run diagnostics" HorizontalAlignment="Left" Style="{StaticResource Primary}" Command="{Binding DiagnosticsCommand}"/><DataGrid Grid.Row="1" ItemsSource="{Binding DiagnosticFindings}" AutoGenerateColumns="True" IsReadOnly="True" Margin="0,10,0,0"/></Grid>
                      </TabItem>
          '@ @'
                      <TabItem Header="Diagnostics">
                          <Grid Margin="12">
                              <Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="Auto"/><RowDefinition Height="*"/></Grid.RowDefinitions>
                              <WrapPanel>
                                  <Button Content="Run diagnostics" HorizontalAlignment="Left" Style="{StaticResource Primary}" Command="{Binding DiagnosticsCommand}"/>
                                  <Button Content="Export support bundle" HorizontalAlignment="Left" Command="{Binding SupportBundleCommand}"/>
                              </WrapPanel>
                              <TextBox Grid.Row="1" Text="{Binding SupportBundlePath}" IsReadOnly="True" Margin="4,6,4,0" ToolTip="Latest redacted support bundle path"/>
                              <DataGrid Grid.Row="2" ItemsSource="{Binding DiagnosticFindings}" AutoGenerateColumns="True" IsReadOnly="True" Margin="0,10,0,0"/>
                          </Grid>
                      </TabItem>
          '@

          $service = 'src/DevBox.Core/Services/SupportBundleService.cs'
          Replace-Required $service @'
                  result = PrivateKeyRegex.Replace(result, "<REDACTED_PRIVATE_KEY>");
                  result = AuthorizationRegex.Replace(result, "$1<REDACTED>");
                  result = BearerRegex.Replace(result, "Bearer <REDACTED>");
                  result = UrlCredentialRegex.Replace(result, "$1<REDACTED>@");
                  result = JwtRegex.Replace(result, "<REDACTED_JWT>");
                  result = SecretAssignmentRegex.Replace(result, match =>
                      match.Groups[1].Value + match.Groups[2].Value + "<REDACTED>");
                  return result;
          '@ @'
                  try
                  {
                      result = PrivateKeyRegex.Replace(result, "<REDACTED_PRIVATE_KEY>");
                      result = AuthorizationRegex.Replace(result, "$1<REDACTED>");
                      result = BearerRegex.Replace(result, "Bearer <REDACTED>");
                      result = UrlCredentialRegex.Replace(result, "$1<REDACTED>@");
                      result = JwtRegex.Replace(result, "<REDACTED_JWT>");
                      result = SecretAssignmentRegex.Replace(result, match =>
                          match.Groups[1].Value + match.Groups[2].Value + "<REDACTED>");
                      return result;
                  }
                  catch (RegexMatchTimeoutException)
                  {
                      return "<REDACTION_FAILED>";
                  }
          '@

          git diff --check

      - name: Commit UI integration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevBox.App/ViewModels/EnvironmentCenterViewModel.cs src/DevBox.App/EnvironmentCenterWindow.xaml src/DevBox.Core/Services/SupportBundleService.cs
          if (git diff --cached --quiet) {
            throw 'Support bundle UI patch produced no change.'
          }
          git commit -m 'feat: expose support bundle export in diagnostics'
          git push origin HEAD:feat/support-bundle
