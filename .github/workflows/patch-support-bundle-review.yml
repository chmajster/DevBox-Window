name: Patch support bundle review findings

on:
  push:
    branches: [ feat/support-bundle ]
    paths:
      - '.github/workflows/patch-support-bundle-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/support-bundle

      - name: Apply review fixes
        shell: pwsh
        run: |
          function Replace-Required([string] $Path, [string] $Old, [string] $New) {
            $text = (Get-Content -LiteralPath $Path -Raw).Replace("`r`n", "`n")
            $oldLf = $Old.Replace("`r`n", "`n")
            $newLf = $New.Replace("`r`n", "`n")
            if (-not $text.Contains($oldLf)) { throw "Expected text was not found in $Path" }
            Set-Content -LiteralPath $Path -Value ($text.Replace($oldLf, $newLf)) -Encoding utf8 -NoNewline
          }

          $service = 'src/DevBox.Core/Services/SupportBundleService.cs'

          Replace-Required $service @'
              private static readonly Regex SecretAssignmentRegex = new(
                  "(?im)\\b(password|passwd|pwd|secret|token|api[_-]?key|cookie|connectionstring|private[_-]?key|credential)\\b(\\s*[:=]\\s*)(?:\"[^\"\\r\\n]*\"|'[^'\\r\\n]*'|[^\\s;\\r\\n]+)",
                  RegexOptions.CultureInvariant,
                  TimeSpan.FromSeconds(1));
          '@ @'
              private static readonly Regex SecretAssignmentRegex = new(
                  "(?im)([\"']?)([A-Za-z0-9_.-]*(?:password|passwd|pwd|secret|token|api[_-]?key|cookie|connectionstring|private[_-]?key|credential))\\1(\\s*[:=]\\s*)(?:\"[^\"\\r\\n]*\"|'[^'\\r\\n]*'|[^\\s;\\r\\n]+)",
                  RegexOptions.CultureInvariant,
                  TimeSpan.FromSeconds(1));
          '@

          Replace-Required $service @'
                  var candidates = new List<FileInfo>();
                  foreach (var path in EnumerateFilesWithoutReparsePoints(logsRoot).Take(MaxLogCandidates))
                  {
                      try
                      {
                          candidates.Add(new FileInfo(path));
                      }
                      catch (Exception ex) when (ex is IOException or UnauthorizedAccessException)
                      {
                          _ = ex;
                      }
                  }

                  long totalBytes = 0;
                  var included = 0;
                  foreach (var info in candidates
                               .OrderByDescending(item => item.LastWriteTimeUtc)
                               .ThenBy(item => item.FullName, StringComparer.OrdinalIgnoreCase))
                  {
                      if (included >= MaxLogFiles)
                          break;

                      var budget = Math.Min(info.Length, MaxLogBytes);
                      if (totalBytes + budget > MaxTotalLogBytes)
                          continue;

                      try
                      {
                          var text = ReadTailText(info.FullName, MaxLogBytes, out var truncated);
                          var relative = Path.GetRelativePath(logsRoot, info.FullName).Replace('\\', '/');
                          var archiveName = "logs/" + relative;
                          var redacted = RedactText(text);
                          if (truncated)
                              redacted = $"[TRUNCATED TO LAST {MaxLogBytes} BYTES]{Environment.NewLine}" + redacted;
                          AddTextEntry(archive, entries, archiveName, redacted);
                          totalBytes += budget;
                          included++;
                      }
                      catch (Exception ex) when (ex is IOException or UnauthorizedAccessException or InvalidOperationException or DecoderFallbackException)
                      {
                          var safeName = "logs/" + Path.GetFileName(info.Name) + ".omitted.txt";
                          AddTextEntry(archive, entries, safeName, "Omitted: " + RedactText(ex.Message));
                      }
                  }
          '@ @'
                  var candidates = new PriorityQueue<(string Path, DateTime LastWriteTimeUtc), long>();
                  foreach (var path in EnumerateFilesWithoutReparsePoints(logsRoot))
                  {
                      try
                      {
                          var info = new FileInfo(path);
                          info.Refresh();
                          if (!info.Exists)
                              continue;

                          var candidate = (Path: path, LastWriteTimeUtc: info.LastWriteTimeUtc);
                          candidates.Enqueue(candidate, candidate.LastWriteTimeUtc.Ticks);
                          if (candidates.Count > MaxLogCandidates)
                              _ = candidates.Dequeue();
                      }
                      catch (Exception ex) when (ex is IOException or UnauthorizedAccessException)
                      {
                          _ = ex;
                      }
                  }

                  long totalBytes = 0;
                  var included = 0;
                  foreach (var candidate in candidates.UnorderedItems
                               .Select(item => item.Element)
                               .OrderByDescending(item => item.LastWriteTimeUtc)
                               .ThenBy(item => item.Path, StringComparer.OrdinalIgnoreCase))
                  {
                      if (included >= MaxLogFiles)
                          break;

                      try
                      {
                          var info = new FileInfo(candidate.Path);
                          info.Refresh();
                          if (!info.Exists)
                              continue;

                          var budget = Math.Min(info.Length, MaxLogBytes);
                          if (totalBytes + budget > MaxTotalLogBytes)
                              continue;

                          var text = ReadTailText(candidate.Path, MaxLogBytes, out var truncated);
                          var relative = Path.GetRelativePath(logsRoot, candidate.Path).Replace('\\', '/');
                          var archiveName = "logs/" + relative;
                          var redacted = RedactText(text);
                          if (truncated)
                              redacted = $"[TRUNCATED TO LAST {MaxLogBytes} BYTES]{Environment.NewLine}" + redacted;
                          AddTextEntry(archive, entries, archiveName, redacted);
                          totalBytes += budget;
                          included++;
                      }
                      catch (Exception ex) when (ex is IOException or UnauthorizedAccessException or InvalidOperationException or DecoderFallbackException)
                      {
                          var safeName = "logs/" + Path.GetFileName(candidate.Path) + ".omitted.txt";
                          AddTextEntry(archive, entries, safeName, "Omitted: " + RedactText(ex.Message));
                      }
                  }
          '@

          Replace-Required $service @'
                      result = SecretAssignmentRegex.Replace(result, match =>
                          match.Groups[1].Value + match.Groups[2].Value + "<REDACTED>");
          '@ @'
                      result = SecretAssignmentRegex.Replace(result, match =>
                          match.Groups[1].Value + match.Groups[2].Value + match.Groups[1].Value + match.Groups[3].Value + "<REDACTED>");
          '@

          Replace-Required $service @'
                  return normalized.Contains("password", StringComparison.Ordinal) ||
                         normalized.Contains("passwd", StringComparison.Ordinal) ||
          '@ @'
                  return normalized.EndsWith("arguments", StringComparison.Ordinal) ||
                         normalized.Contains("password", StringComparison.Ordinal) ||
                         normalized.Contains("passwd", StringComparison.Ordinal) ||
          '@

          $tests = 'tests/DevBox.Tests/SupportBundleServiceTests.cs'
          Replace-Required $tests @'
              [Fact]
              public void Create_UsesUniqueAtomicArchives()
          '@ @'
              [Fact]
              public void Create_RedactsArgumentArraysCompoundKeysAndMalformedJson()
              {
                  var root = TemporaryRoot();
                  try
                  {
                      RuntimeLayout.EnsureInitialized(root);
                      File.WriteAllText(
                          Path.Combine(root, "config", "services.json"),
                          """
                          [
                            {
                              "key": "custom",
                              "arguments": ["--password", "argument-secret", "--safe", "visible"],
                              "stopArguments": ["--token", "stop-token-secret"]
                            }
                          ]
                          """);
                      File.WriteAllText(
                          Path.Combine(root, "config", "appsettings.json"),
                          "{ \"password\": \"malformed-json-secret\", garbage");
                      File.WriteAllText(
                          Path.Combine(root, "logs", "compound.log"),
                          "MYSQL_PASSWORD=mysql-secret\nCLIENT_SECRET=client-secret\nACCESS_TOKEN=access-token-secret\nsafe=value\n");

                      var result = new SupportBundleService(root).Create();

                      using var archive = ZipFile.OpenRead(result.ArchivePath);
                      var services = ReadEntry(archive, "config-redacted/services.json");
                      Assert.Contains("<REDACTED>", services, StringComparison.Ordinal);
                      Assert.DoesNotContain("argument-secret", services, StringComparison.Ordinal);
                      Assert.DoesNotContain("stop-token-secret", services, StringComparison.Ordinal);

                      var appSettings = ReadEntry(archive, "config-redacted/appsettings.json");
                      Assert.DoesNotContain("malformed-json-secret", appSettings, StringComparison.Ordinal);
                      Assert.Contains("<REDACTED>", appSettings, StringComparison.Ordinal);

                      var log = ReadEntry(archive, "logs/compound.log");
                      Assert.DoesNotContain("mysql-secret", log, StringComparison.Ordinal);
                      Assert.DoesNotContain("client-secret", log, StringComparison.Ordinal);
                      Assert.DoesNotContain("access-token-secret", log, StringComparison.Ordinal);
                      Assert.Contains("safe=value", log, StringComparison.Ordinal);
                  }
                  finally
                  {
                      DeleteRoot(root);
                  }
              }

              [Fact]
              public void Create_SelectsNewestLogsAcrossTheBoundedCandidateSet()
              {
                  var root = TemporaryRoot();
                  try
                  {
                      RuntimeLayout.EnsureInitialized(root);
                      var baseline = DateTime.UtcNow.AddDays(-2);
                      for (var index = 0; index < 520; index++)
                      {
                          var path = Path.Combine(root, "logs", $"log-{index:D3}.log");
                          File.WriteAllText(path, $"log {index}");
                          File.SetLastWriteTimeUtc(path, baseline.AddMinutes(index));
                      }

                      var result = new SupportBundleService(root).Create();

                      using var archive = ZipFile.OpenRead(result.ArchivePath);
                      var names = archive.Entries
                          .Where(entry => entry.FullName.StartsWith("logs/", StringComparison.OrdinalIgnoreCase))
                          .Select(entry => entry.FullName)
                          .ToHashSet(StringComparer.OrdinalIgnoreCase);
                      Assert.Equal(20, result.IncludedLogCount);
                      Assert.Contains("logs/log-519.log", names);
                      Assert.Contains("logs/log-500.log", names);
                      Assert.DoesNotContain("logs/log-000.log", names);
                  }
                  finally
                  {
                      DeleteRoot(root);
                  }
              }

              [Fact]
              public void Create_UsesUniqueAtomicArchives()
          '@

          git diff --check

      - name: Commit review fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevBox.Core/Services/SupportBundleService.cs tests/DevBox.Tests/SupportBundleServiceTests.cs
          if (git diff --cached --quiet) { throw 'Support bundle review patch produced no change.' }
          git commit -m 'fix: close support bundle redaction and log races'
          git push origin HEAD:feat/support-bundle
