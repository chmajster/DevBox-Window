name: Apply final bug sweep round 10

on:
  push:
    branches:
      - fix/final-bug-sweep-round10-changelog
    paths:
      - .github/final-bug-sweep-round10-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-bug-sweep-round10-changelog
          fetch-depth: 0

      - name: Apply fixes, tests and changelog
        shell: pwsh
        run: python .github/scripts/apply-final-bug-sweep-round10.py

      - name: Commit product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests CHANGELOG.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: harden archive process and rollback boundaries"
            git push origin HEAD:fix/final-bug-sweep-round10-changelog
          }

      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          dotnet build DevBox.sln --configuration Release
          dotnet test DevBox.sln --configuration Release --no-build
