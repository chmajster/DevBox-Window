name: Validate audit round 5

on:
  push:
    branches:
      - fix/post-merge-audit-round5
    paths:
      - .github/audit-round5-trigger

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-audit-round5
          fetch-depth: 0

      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          dotnet build DevBox.sln --configuration Release
          dotnet test DevBox.sln --configuration Release --no-build
