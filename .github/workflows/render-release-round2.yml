name: Render updated release workflow

on:
  push:
    branches:
      - fix/post-merge-audit-round2-2026-09-11
    paths:
      - .github/workflows/render-release-round2.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Render release workflow
        run: python .github/scripts/render_release_round2.py
      - name: Commit rendered copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-updated.yml
          git commit -m "chore: render updated release workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
