name: Apply runtime download restart fix

on:
  push:
    branches:
      - fix/runtime-download-restart-service
    paths:
      - .github/runtime-download-restart-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/runtime-download-restart-service
          fetch-depth: 0

      - name: Apply fix
        run: python .github/scripts/apply_runtime_download_restart.py

      - name: Validate fix
        shell: bash
        run: |
          git diff --check
          grep -q 'RuntimeManager.InstallAsync verifies SHA-256' src/DevBox.App/ViewModels/MainWindowViewModel.cs
          grep -q 'await _processManager.StopAsync(service!);' src/DevBox.App/ViewModels/MainWindowViewModel.cs
          grep -q 'await _processManager.StartAsync(service!);' src/DevBox.App/ViewModels/MainWindowViewModel.cs

      - name: Commit application fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevBox.App/ViewModels/MainWindowViewModel.cs
          git commit -m 'fix: restart active service around runtime download'
          git push origin HEAD:fix/runtime-download-restart-service
