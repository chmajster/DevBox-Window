name: Append round11 app changelog

on:
  push:
    branches: [fix/final-bug-sweep-round11-changelog]
    paths: [.github/round11-app-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-bug-sweep-round11-changelog
          fetch-depth: 0
      - run: python .github/scripts/append-round11-app-changelog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: record round11 app fixes"
          git push origin HEAD:fix/final-bug-sweep-round11-changelog
