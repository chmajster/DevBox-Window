name: Temporary Audit Round 4 Repair

on:
  push:
    branches:
      - fix/audit-round4
    paths:
      - .github/workflows/audit4-temp.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: windows-2025
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/audit-round4
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Fix audit patch matcher
        run: python scripts/audit4_patch_fixup.py

      - name: Apply audit round 4 repairs
        run: python scripts/audit4_patch.py

      - name: Validate diff
        shell: pwsh
        run: |
          git diff --check
          git status --short

      - name: Restore
        run: dotnet restore DevBox.sln

      - name: Build
        run: dotnet build DevBox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DevBox.sln --configuration Release --no-build --logger "trx;LogFileName=audit4-results.trx"

      - name: Publish GUI win-x64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64

      - name: Publish GUI win-arm64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/win-arm64

      - name: Commit validated product changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests CHANGELOG.md
          git diff --cached --check
          if (git diff --cached --quiet) { throw 'Audit round 4 produced no product changes.' }
          git commit -m 'fix: harden CA transactions, cross-process catalogs and rollback safety'
          git push origin HEAD:fix/audit-round4
