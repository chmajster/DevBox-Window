name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package without creating a GitHub Release'
        required: true
        default: '0.2.2'
        type: string

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:MANUAL_VERSION
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            if ($env:HEAD_COMMIT_MESSAGE -notmatch '^release:\s+v(?<version>\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?)') {
              throw "Main-branch release commits must use: release: vX.Y.Z"
            }
            $version = $Matches.version
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }

          "DEVBOX_VERSION=$version" >> $env:GITHUB_ENV
          "DEVBOX_RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore DevBox.sln

      - name: NuGet vulnerability audit
        run: dotnet list DevBox.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build DevBox.sln --configuration Release --no-restore /p:Version=${{ env.DEVBOX_VERSION }}

      - name: Test
        run: dotnet test DevBox.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish GUI win-x64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64 /p:Version=${{ env.DEVBOX_VERSION }}

      - name: Publish GUI win-arm64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-arm64 --self-contained true --output publish/win-arm64 /p:Version=${{ env.DEVBOX_VERSION }}

      - name: Publish CLI win-x64
        run: dotnet publish src/DevBox.Cli/DevBox.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/cli-win-x64 /p:Version=${{ env.DEVBOX_VERSION }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish CLI win-arm64
        run: dotnet publish src/DevBox.Cli/DevBox.Cli.csproj --configuration Release --runtime win-arm64 --self-contained true --output publish/cli-win-arm64 /p:Version=${{ env.DEVBOX_VERSION }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Add CLI to application layouts without replacing GUI
        shell: pwsh
        run: |
          $layouts = @(
            @{
              Gui = 'publish/win-x64/DevBox.exe'
              CliSource = 'publish/cli-win-x64/devbox.exe'
              CliDirectory = 'publish/win-x64/cli'
            },
            @{
              Gui = 'publish/win-arm64/DevBox.exe'
              CliSource = 'publish/cli-win-arm64/devbox.exe'
              CliDirectory = 'publish/win-arm64/cli'
            }
          )

          foreach ($layout in $layouts) {
            if (-not (Test-Path $layout.Gui)) {
              throw "GUI publish did not produce $($layout.Gui)"
            }
            if (-not (Test-Path $layout.CliSource)) {
              throw "CLI publish did not produce $($layout.CliSource)"
            }

            $guiHashBefore = (Get-FileHash $layout.Gui -Algorithm SHA256).Hash
            New-Item -ItemType Directory -Force $layout.CliDirectory | Out-Null
            $cliTarget = Join-Path $layout.CliDirectory 'devbox.exe'
            Copy-Item $layout.CliSource $cliTarget -Force
            $guiHashAfter = (Get-FileHash $layout.Gui -Algorithm SHA256).Hash

            if ($guiHashBefore -ne $guiHashAfter) {
              throw "GUI executable changed while adding CLI to $($layout.CliDirectory)"
            }
            if (-not (Test-Path $cliTarget)) {
              throw "CLI was not added to $($layout.CliDirectory)"
            }
          }

      - name: Prepare Authenticode certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            Write-Host "Authenticode certificate is not configured; release artifacts will remain unsigned."
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'devbox-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          } catch {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not valid base64."
          }
          "enabled=true" >> $env:GITHUB_OUTPUT
          "certificate=$certificatePath" >> $env:GITHUB_OUTPUT

      - name: Sign DevBox application binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found on the runner.' }

          $targets = @(
            'publish/win-x64/DevBox.exe',
            'publish/win-x64/DevBox.dll',
            'publish/win-x64/DevBox.Core.dll',
            'publish/win-x64/cli/devbox.exe',
            'publish/win-arm64/DevBox.exe',
            'publish/win-arm64/DevBox.dll',
            'publish/win-arm64/DevBox.Core.dll',
            'publish/win-arm64/cli/devbox.exe'
          )
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Signing target not found: $target" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $env:SIGNING_CERTIFICATE_PATH /p $env:SIGNING_CERTIFICATE_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $target" }
          }

      - name: Bundle Nginx, PHP and MySQL runtimes
        shell: pwsh
        run: |
          & ./packaging/Prepare-BundledRuntimes.ps1 -PublishDirectories "publish/win-x64","publish/win-arm64"

      - name: Package portable builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "artifacts/DevBox-$env:DEVBOX_VERSION-win-x64-portable.zip" -CompressionLevel Optimal
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "artifacts/DevBox-$env:DEVBOX_VERSION-win-arm64-portable.zip" -CompressionLevel Optimal

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found after installation: $iscc"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:DEVBOX_VERSION" "/DPublishDir=$pwd\publish\win-x64" "/DOutputDir=$pwd\artifacts" "installer\DevBox.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found on the runner.' }
          $installer = "artifacts/DevBox-$env:DEVBOX_VERSION-win-x64-setup.exe"
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $env:SIGNING_CERTIFICATE_PATH /p $env:SIGNING_CERTIFICATE_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed for installer.' }

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate }}
        run: |
          if (Test-Path $env:SIGNING_CERTIFICATE_PATH) {
            Remove-Item $env:SIGNING_CERTIFICATE_PATH -Force
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload release build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DevBox-release-${{ env.DEVBOX_VERSION }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:DEVBOX_RELEASE_TAG

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $tag artifacts/* --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "DevBox $env:DEVBOX_VERSION"
          } else {
            gh release create $tag artifacts/* --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --generate-notes --title "DevBox $env:DEVBOX_VERSION"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }
