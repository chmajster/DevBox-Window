name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: devbox-manual-release
  cancel-in-progress: false

jobs:
  guard:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual releases must be started from the main branch."
            exit 1
          fi

  tests:
    name: Run release validation
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump version and publish
    needs: tests
    runs-on: windows-2025
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Resolve next version from latest GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          $latestReleaseTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($latestReleaseTag)) {
            $currentText = '0.0.0'
          } else {
            $latestReleaseTag = $latestReleaseTag.Trim()
            $match = [regex]::Match($latestReleaseTag, '^v(?<version>\d+\.\d+\.\d+)$')
            if (-not $match.Success) {
              throw "Latest GitHub Release tag '$latestReleaseTag' is not valid SemVer in vMAJOR.MINOR.PATCH format."
            }
            $currentText = $match.Groups['version'].Value
          }

          $parts = $currentText.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          switch ($env:VERSION_BUMP) {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++; $patch = 0 }
            'patch' { $patch++ }
            default { throw "Unsupported version increment: $env:VERSION_BUMP" }
          }

          $nextVersion = "$major.$minor.$patch"
          $releaseTag = "v$nextVersion"

          git fetch origin --tags --force
          if (-not [string]::IsNullOrWhiteSpace((git tag --list $releaseTag))) {
            throw "Tag $releaseTag already exists."
          }

          "DEVBOX_CURRENT_VERSION=$currentText" >> $env:GITHUB_ENV
          "DEVBOX_VERSION=$nextVersion" >> $env:GITHUB_ENV
          "DEVBOX_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV

      - name: Update version metadata
        shell: pwsh
        run: |
          $projectPath = 'src/DevBox.App/DevBox.App.csproj'
          $project = Get-Content $projectPath -Raw
          $project = [regex]::Replace($project, '<Version>\d+\.\d+\.\d+</Version>', "<Version>$env:DEVBOX_VERSION</Version>")
          $project = [regex]::Replace($project, '<AssemblyVersion>\d+\.\d+\.\d+\.\d+</AssemblyVersion>', "<AssemblyVersion>$env:DEVBOX_VERSION.0</AssemblyVersion>")
          $project = [regex]::Replace($project, '<FileVersion>\d+\.\d+\.\d+\.\d+</FileVersion>', "<FileVersion>$env:DEVBOX_VERSION.0</FileVersion>")
          Set-Content $projectPath $project -Encoding utf8 -NoNewline

          $installerPath = 'installer/DevBox.iss'
          $installer = Get-Content $installerPath -Raw
          $installer = [regex]::Replace(
            $installer,
            '#define MyAppVersion "\d+\.\d+\.\d+"',
            "#define MyAppVersion `"$env:DEVBOX_VERSION`"",
            1)
          Set-Content $installerPath $installer -Encoding utf8 -NoNewline

          $readmePath = 'README.md'
          $readme = Get-Content $readmePath -Raw
          $readme = [regex]::Replace(
            $readme,
            'Current application version: `\d+\.\d+\.\d+`(?: \(development; latest published release remains `\d+\.\d+\.\d+`\))?\.',
            ('Current application version: `' + $env:DEVBOX_VERSION + '`.'),
            1)
          Set-Content $readmePath $readme -Encoding utf8 -NoNewline

          git diff --check

      - name: Publish GUI win-x64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64 /p:Version=${{ env.DEVBOX_VERSION }}

      - name: Publish GUI win-arm64
        run: dotnet publish src/DevBox.App/DevBox.App.csproj --configuration Release --runtime win-arm64 --self-contained true --output publish/win-arm64 /p:Version=${{ env.DEVBOX_VERSION }}

      - name: Publish CLI win-x64
        run: dotnet publish src/DevBox.Cli/DevBox.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/cli-win-x64 /p:Version=${{ env.DEVBOX_VERSION }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish CLI win-arm64
        run: dotnet publish src/DevBox.Cli/DevBox.Cli.csproj --configuration Release --runtime win-arm64 --self-contained true --output publish/cli-win-arm64 /p:Version=${{ env.DEVBOX_VERSION }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Add CLI to application layouts
        shell: pwsh
        run: |
          $layouts = @(
            @{ CliSource = 'publish/cli-win-x64/devbox.exe'; CliDirectory = 'publish/win-x64/cli' },
            @{ CliSource = 'publish/cli-win-arm64/devbox.exe'; CliDirectory = 'publish/win-arm64/cli' }
          )
          foreach ($layout in $layouts) {
            if (-not (Test-Path $layout.CliSource)) { throw "CLI build not found: $($layout.CliSource)" }
            New-Item -ItemType Directory -Force $layout.CliDirectory | Out-Null
            Copy-Item $layout.CliSource (Join-Path $layout.CliDirectory 'devbox.exe') -Force
          }

      - name: Bundle Nginx, PHP and MySQL runtimes
        shell: pwsh
        run: |
          & ./packaging/Prepare-BundledRuntimes.ps1 -PublishDirectories "publish/win-x64","publish/win-arm64"

      - name: Package portable builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "artifacts/DevBox-$env:DEVBOX_VERSION-win-x64-portable.zip" -CompressionLevel Optimal
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "artifacts/DevBox-$env:DEVBOX_VERSION-win-arm64-portable.zip" -CompressionLevel Optimal

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found after installation: $iscc"
          }

      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:DEVBOX_VERSION" "/DMyAppRid=win-x64" "/DMyArchitecturesAllowed=x64compatible" "/DMyArchitecturesInstallMode=x64compatible" "/DPublishDir=$pwd\publish\win-x64" "/DOutputDir=$pwd\artifacts" "installer\DevBox.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup x64 build failed with exit code $LASTEXITCODE" }
          & $iscc "/DMyAppVersion=$env:DEVBOX_VERSION" "/DMyAppRid=win-arm64" "/DMyArchitecturesAllowed=arm64" "/DMyArchitecturesInstallMode=arm64" "/DPublishDir=$pwd\publish\win-arm64" "/DOutputDir=$pwd\artifacts" "installer\DevBox.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ARM64 build failed with exit code $LASTEXITCODE" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Commit version bump and create tag
        shell: pwsh
        run: |
          git fetch origin main --tags
          $remoteMain = (git rev-parse origin/main).Trim()
          $localBase = (git rev-parse HEAD).Trim()
          if ($remoteMain -ne $localBase) {
            throw 'main changed while the release was being built. Run Manual Release again from the latest main.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevBox.App/DevBox.App.csproj installer/DevBox.iss README.md
          git commit -m "release: $env:DEVBOX_RELEASE_TAG"
          git tag -a $env:DEVBOX_RELEASE_TAG -m "DevBox $env:DEVBOX_VERSION"
          $tagRef = "refs/tags/$env:DEVBOX_RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "${tagRef}:${tagRef}"
          if ($LASTEXITCODE -ne 0) {
            throw "Atomic push of main and $tagRef failed with exit code $LASTEXITCODE"
          }

      - name: Upload release build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DevBox-release-${{ env.DEVBOX_VERSION }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:DEVBOX_RELEASE_TAG artifacts/* --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "DevBox $env:DEVBOX_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }
